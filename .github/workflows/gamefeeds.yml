# GameFeed.json de matchs joués par le moteur complet du notebook (comme la semaine : blocs A-F, horloge réelle,
# punts avec retour, checks avant le snap, retransmission ; notes des joueurs et staffs de la dernière semaine de
# data/weeks), à charger sur le site : tuile Exhibition ->
# « Watch the match » -> bouton « Load GameFeed ». Rien n'est ajouté au dépôt : les fichiers sont dans l'artefact
# « gamefeeds-exhibition » de l'exécution (Actions -> cette exécution -> Artifacts). ≈ 15 min
# (chargement du moteur ≈ 8-10 min, puis ≈ 5 s par match).
name: GameFeeds d'exhibition

on:
  workflow_dispatch:
    inputs:
      matchs:
        description: "Affiches « VIS@DOM,… » ou « tous » (56 affiches à 8 équipes)"
        default: "tous"
      par_affiche:
        description: "Matchs par affiche"
        default: "1"
  push:
    paths:
      - ".github/workflows/gamefeeds.yml"
      - "gamecenter_serveur (1)/outils/exhibition/gamefeeds.py"

permissions:
  contents: read

jobs:
  gamefeeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "gamecenter_serveur (1)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: pip install -r requirements-semaine.txt
      - name: Tests du moteur
        run: python -m unittest discover -s moteur/tests -t .
      - name: Jouer les matchs (moteur complet, jusqu'à la dernière cellule 12.2)
        run: python outils/exhibition/gamefeeds.py --matchs "${{ github.event.inputs.matchs || 'tous' }}" --par-affiche "${{ github.event.inputs.par_affiche || '1' }}" --sortie gamefeeds
      - uses: actions/upload-artifact@v4
        with:
          name: gamefeeds-exhibition
          path: "gamecenter_serveur (1)/gamefeeds/*.json"
          retention-days: 30
