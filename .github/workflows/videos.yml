# Vidéos verticales pour les réseaux (bloc 2, étape 8) : MP4 1080×1920 + légende, à télécharger puis publier à la main
# (TikTok, Reels, Shorts). Rien n'est ajouté au dépôt : les vidéos sont des « artifacts » de l'exécution (30 jours).
# Tous les soirs à 22 h 30 UTC (00 h 30 l'été, 23 h 30 l'hiver à Bruxelles, la journée de matchs est finie) :
#   l'action du jour ; le dimanche soir, en plus, le résumé court (≈ 60 s) du plus beau match de la semaine, le champion
#   de la Grand Final et le joueur de la semaine (étape 8.6 a) ; le mercredi, le match hors norme de la semaine s'il y
#   en a un (record ou 100 points cumulés) ; le vendredi, la franchise de la semaine (étape 8.6 b).
# À la demande (onglet Actions → « Vidéos » → Run workflow) : action d'un jour, résumé court d'un match, résumé long
#   (2 à 3 min), la plus belle action jusqu'ici (« Best play so far », étape 8.2) ou « What is Snapline? » (étape 8.3).
# Tournage image par image à 60 images/s (étape 8.3) ; habillage « AI vs AI » aux couleurs du site (20/10/2026), vue
#   normale (jamais « Bigger field »), MP4 1080×1920 haute qualité + couverture JPEG (…-cover.jpg) : ≈ 2-3 min par action.
# Script : outils/video/faire_video.py (README section 46).
name: Vidéos

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "action = action du jour · resume = résumé court · long = résumé long · meilleure = plus belle action · presentation = What is Snapline? · joueur = joueur de la semaine · champion = champion de la Grand Final · chiffres = match hors norme · franchise = franchise de la semaine"
        type: choice
        options: [action, resume, long, meilleure, presentation, joueur, champion, chiffres, franchise]
        default: action
      jour:
        description: "Jour de l'action (AAAA-MM-JJ) ; vide = la journée qui vient de finir"
        required: false
        default: ""
      match:
        description: "Match à résumer (ex. w3-r91) ; vide = le plus beau match de la semaine"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-24.04   # Playwright 1.56.1 n'installe pas Chromium sur ubuntu-latest = 26.04 (27/10/2026)
    timeout-minutes: 90
    defaults:
      run:
        working-directory: "gamecenter_serveur (1)"
    env:
      NODE_PATH: ${{ github.workspace }}/../pw/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer (serveur, Playwright + Chromium, ffmpeg)
        run: |
          pip install -q -r requirements.txt
          npm install --no-audit --no-fund --prefix "$GITHUB_WORKSPACE/../pw" playwright@1.56.1
          node "$GITHUB_WORKSPACE/../pw/node_modules/playwright/cli.js" install --with-deps chromium
          command -v ffmpeg > /dev/null || sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Quelles vidéos
        id: quoi
        env:
          EVENEMENT: ${{ github.event_name }}
          TYPE: ${{ inputs.type }}
          JOUR: ${{ inputs.jour }}
        run: |
          jour="${JOUR:-$(TZ=Europe/Brussels date -d '3 hours ago' +%F)}"
          if [ "$EVENEMENT" = workflow_dispatch ]; then liste="$TYPE"
          elif [ "$(date -d "$jour" +%u)" = 7 ]; then liste="action resume champion joueur"
          elif [ "$(date -d "$jour" +%u)" = 3 ]; then liste="action chiffres"
          elif [ "$(date -d "$jour" +%u)" = 5 ]; then liste="action franchise"
          else liste="action"; fi
          echo "jour=$jour" >> "$GITHUB_OUTPUT"; echo "liste=$liste" >> "$GITHUB_OUTPUT"
          echo "Jour $jour · vidéos : $liste"
      - name: Action du jour
        if: contains(steps.quoi.outputs.liste, 'action')
        run: python outils/video/faire_video.py action --jour "${{ steps.quoi.outputs.jour }}" --sortie videos
      - name: Plus belle action jusqu'ici
        if: contains(steps.quoi.outputs.liste, 'meilleure')
        run: python outils/video/faire_video.py action --meilleure --jour "${{ steps.quoi.outputs.jour }}" --sortie videos
      - name: What is Snapline?
        if: contains(steps.quoi.outputs.liste, 'presentation')
        run: python outils/video/faire_video.py presentation --jour "${{ steps.quoi.outputs.jour }}" --sortie videos
      - name: Résumé long d'un match
        if: contains(steps.quoi.outputs.liste, 'long')
        env:
          MATCH: ${{ inputs.match }}
        run: python outils/video/faire_video.py resume --long --jour "${{ steps.quoi.outputs.jour }}" ${MATCH:+--match "$MATCH"} --sortie videos
      - name: Résumé court d'un match
        if: contains(steps.quoi.outputs.liste, 'resume')
        env:
          MATCH: ${{ inputs.match }}
        run: python outils/video/faire_video.py resume --jour "${{ steps.quoi.outputs.jour }}" ${MATCH:+--match "$MATCH"} --sortie videos
      - name: Champion de la Grand Final
        if: contains(steps.quoi.outputs.liste, 'champion')
        run: python outils/video/faire_video.py champion --jour "${{ steps.quoi.outputs.jour }}" --sortie videos
      - name: Joueur de la semaine
        if: contains(steps.quoi.outputs.liste, 'joueur')
        run: python outils/video/faire_video.py joueur --jour "${{ steps.quoi.outputs.jour }}" --sortie videos
      - name: Match hors norme
        if: contains(steps.quoi.outputs.liste, 'chiffres')
        run: python outils/video/faire_video.py chiffres --jour "${{ steps.quoi.outputs.jour }}" --sortie videos
      - name: Franchise de la semaine
        if: contains(steps.quoi.outputs.liste, 'franchise')
        run: python outils/video/faire_video.py franchise --jour "${{ steps.quoi.outputs.jour }}" --sortie videos
      - uses: actions/upload-artifact@v4
        with:
          name: videos-${{ steps.quoi.outputs.jour }}
          path: "gamecenter_serveur (1)/videos/"
          retention-days: 30
          if-no-files-found: error
